apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}-config
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.appConfig.environment | quote }}
  WELCOME_MSG: {{ .Values.appConfig.welcomeMessage | quote }}
  LOG_LEVEL: {{ .Values.appConfig.logLevel | quote }}
