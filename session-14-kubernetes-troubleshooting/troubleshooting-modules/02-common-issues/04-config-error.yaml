# BROKEN: References missing ConfigMap and non-existent key
apiVersion: v1
kind: Pod
metadata:
  name: broken-config-pod
  labels:
    app: config-demo
spec:
  containers:
  - name: app
    image: nginx:alpine
    env:
    - name: MISSING_CONFIG_VAR
      valueFrom:
        configMapKeyRef:
          name: nonexistent-configmap
          key: missing_key
---
# FIXED: Create ConfigMap and reference existing key
apiVersion: v1
kind: ConfigMap
metadata:
  name: valid-app-config
data:
  APP_PORT: "8080"
---
apiVersion: v1
kind: Pod
metadata:
  name: fixed-config-pod
  labels:
    app: config-demo
spec:
  containers:
  - name: app
    image: nginx:alpine
    env:
    - name: APP_PORT
      valueFrom:
        configMapKeyRef:
          name: valid-app-config
          key: APP_PORT
