apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-nodeport
  labels:
    app: app-nodeport
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-nodeport
  template:
    metadata:
      labels:
        app: app-nodeport
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        command: ["/bin/sh", "-c", "echo '<h1>Response from NodePort Service Backend (Port 31080)</h1>' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"]
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-nodeport-service
spec:
  type: NodePort
  selector:
    app: app-nodeport
  ports:
  - port: 80
    targetPort: 80
    nodePort: 31080
