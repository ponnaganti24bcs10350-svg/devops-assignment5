apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app-headless
  labels:
    app: app-headless
spec:
  serviceName: my-headless-service
  replicas: 2
  selector:
    matchLabels:
      app: app-headless
  template:
    metadata:
      labels:
        app: app-headless
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        command: ["/bin/sh", "-c", "echo '<h1>Response from Headless Service Pod: ' $HOSTNAME '</h1>' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"]
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-headless-service
spec:
  clusterIP: None
  selector:
    app: app-headless
  ports:
  - port: 80
    targetPort: 80
