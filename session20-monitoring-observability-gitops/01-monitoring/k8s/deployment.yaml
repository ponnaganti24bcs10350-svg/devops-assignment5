apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-demo-app
  labels:
    app: observability-demo
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: observability-demo
  template:
    metadata:
      labels:
        app: observability-demo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: app
        image: python:3.11-slim
        command: ["python", "-c"]
        args:
        - |
          import http.server, time, json, os, logging
          logging.basicConfig(level=logging.INFO, format='%(message)s')
          logger = logging.getLogger("ObservabilityApp")
          count = 0
          start = time.time()
          class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
              global count
              count += 1
              if self.path in ['/', '/healthz']:
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(json.dumps({'status':'HEALTHY','uptime_seconds':round(time.time()-start,1)}).encode())
              elif self.path == '/metrics':
                self.send_response(200)
                self.send_header('Content-Type', 'text/plain; version=0.0.4')
                self.end_headers()
                out = f"# HELP http_requests_total Total requests\n# TYPE http_requests_total counter\nhttp_requests_total {count}\n# HELP app_health_status Health\n# TYPE app_health_status gauge\napp_health_status 1\n"
                self.wfile.write(out.encode())
              else:
                self.send_response(404)
                self.end_headers()
          http.server.HTTPServer(('0.0.0.0', 8080), H).serve_forever()
        ports:
        - containerPort: 8080
          name: http-metrics
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: observability-demo-service
  labels:
    app: observability-demo
spec:
  type: ClusterIP
  selector:
    app: observability-demo
  ports:
  - port: 8080
    targetPort: 8080
    name: http
