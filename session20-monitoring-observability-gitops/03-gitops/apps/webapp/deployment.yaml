apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-webapp
  namespace: default
  labels:
    app.kubernetes.io/name: gitops-webapp
    app.kubernetes.io/part-of: devops-gitops-fleet
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: gitops-webapp
  template:
    metadata:
      labels:
        app: gitops-webapp
    spec:
      containers:
      - name: webapp
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-webapp-service
  namespace: default
  labels:
    app.kubernetes.io/name: gitops-webapp
spec:
  type: ClusterIP
  selector:
    app: gitops-webapp
  ports:
  - port: 80
    targetPort: 80
    name: http
