apiVersion: v1
kind: Pod
metadata:
  name: pod-secret-demo
  labels:
    app: secret-demo
spec:
  containers:
  - name: app-container
    image: alpine:latest
    command: ["/bin/sh", "-c", "echo '=== Secret Values Injected ==='; env | grep -E 'DB_PASSWORD|API_KEY|JWT_SECRET'; echo '=== Mounted Secret File ==='; cat /etc/secrets/secret.key; sleep 3600"]
    env:
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_PASSWORD
    - name: API_KEY
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: API_KEY
    envFrom:
    - secretRef:
        name: app-secret
    volumeMounts:
    - name: secret-volume
      mountPath: /etc/secrets
      readOnly: true
  volumes:
  - name: secret-volume
    secret:
      secretName: app-secret
