apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-app
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-api
        image: nginx:alpine
        command: ["/bin/sh", "-c", "echo '<h1>🛍️ Order Service API Online (HTTP 200)</h1>' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"]
        ports:
        - containerPort: 80
---
# BROKEN SERVICE: Selector mismatch (app: orders) and wrong targetPort (9090 instead of 80)
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: ClusterIP
  selector:
    app: orders # BUG 1: Label selector mismatch! Pod has 'app: order-service'
  ports:
  - port: 80
    targetPort: 9090 # BUG 2: TargetPort 9090 doesn't match containerPort 80
---
# INGRESS RESOURCE
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: orders.local
    http:
      paths:
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 80
