apiVersion: v1
kind: ConfigMap
metadata:
  name: web-app-config
  labels:
    app: miniproject-web
data:
  APP_ENV: "production"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "webapp_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  labels:
    app: miniproject-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: miniproject-web
  template:
    metadata:
      labels:
        app: miniproject-web
    spec:
      containers:
      - name: web-server
        image: nginx:alpine
        command:
        - /bin/sh
        - -c
        - |
          echo '<h1>🚀 Session 13 Mini-Project: Scalable Web Application with Probes & PVC</h1>' > /usr/share/nginx/html/index.html
          echo 'OK' > /usr/share/nginx/html/healthz
          nginx -g 'daemon off;'
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 128Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 3
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        envFrom:
        - configMapRef:
            name: web-app-config
---
apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  labels:
    app: miniproject-web
spec:
  type: NodePort
  selector:
    app: miniproject-web
  ports:
  - port: 80
    targetPort: 80
    nodePort: 32080
