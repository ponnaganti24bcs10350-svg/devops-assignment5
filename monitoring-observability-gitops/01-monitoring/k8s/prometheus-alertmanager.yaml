apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

  alert_rules.yml: |
    groups:
      - name: application_alerts
        rules:
          - alert: HighCPUUtilization
            expr: process_cpu_utilization_percent{service="observability-demo"} > 80
            for: 2m
            labels:
              severity: warning
              team: platform-devops
            annotations:
              summary: "High CPU utilization detected on {{ $labels.instance }}"
              description: "CPU utilization has exceeded 80% for more than 2 minutes."

          - alert: HighMemoryUtilization
            expr: (process_memory_utilization_bytes / process_memory_utilization_total_bytes) * 100 > 85
            for: 3m
            labels:
              severity: critical
              team: platform-devops
            annotations:
              summary: "High Memory usage on {{ $labels.instance }}"
              description: "Memory utilization is above 85% for 3+ minutes."

          - alert: ApplicationDown
            expr: app_health_status{service="observability-demo"} == 0 or absent(app_health_status{service="observability-demo"})
            for: 1m
            labels:
              severity: page
              team: platform-devops
            annotations:
              summary: "Microservice {{ $labels.service }} is DOWN"
              description: "Application health check failed or metrics target unreachable."
