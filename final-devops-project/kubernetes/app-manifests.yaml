apiVersion: v1
kind: Namespace
metadata:
  name: final-devops-prod
  labels:
    environment: production
    managed-by: argocd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: final-devops-prod
data:
  APP_NAME: "Final-DevOps-Enterprise-Platform"
  NODE_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: final-devops-prod
type: Opaque
stringData:
  DB_PASSWORD: "HardenedProductionPassword2026!"
  API_SECRET_KEY: "supersecret-jwt-key-for-devops-capstone"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-storage-pvc
  namespace: final-devops-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: final-devops-deployment
  namespace: final-devops-prod
  labels:
    app.kubernetes.io/name: final-devops-app
    app.kubernetes.io/version: "2.0.0"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: final-devops-app
  template:
    metadata:
      labels:
        app: final-devops-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: enterprise-api
        image: node:20-alpine
        command: ["node", "-e"]
        args:
        - |
          const http = require('http');
          const start = Date.now();
          let count = 0;
          http.createServer((req, res) => {
            count++;
            if (req.url === '/' || req.url === '/healthz') {
              res.writeHead(200, {'Content-Type': 'application/json'});
              res.end(JSON.stringify({status: 'HEALTHY', app: 'Final-DevOps-Enterprise-Platform', student: 'Srividya Ponnaganti (24BCS10350)', uptime: (Date.now()-start)/1000}));
            } else if (req.url === '/ready') {
              res.writeHead(200, {'Content-Type': 'application/json'});
              res.end(JSON.stringify({status: 'READY'}));
            } else if (req.url === '/metrics') {
              res.writeHead(200, {'Content-Type': 'text/plain'});
              res.end('# HELP http_requests_total Total requests\n# TYPE http_requests_total counter\nhttp_requests_total ' + count + '\n');
            } else {
              res.writeHead(404);
              res.end();
            }
          }).listen(8080);
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          failureThreshold: 30
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: app-storage
          mountPath: /data
      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: app-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: final-devops-service
  namespace: final-devops-prod
  labels:
    app: final-devops-app
spec:
  type: ClusterIP
  selector:
    app: final-devops-app
  ports:
  - port: 80
    targetPort: 8080
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: final-devops-ingress
  namespace: final-devops-prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: devops-final.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: final-devops-service
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: final-devops-hpa
  namespace: final-devops-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: final-devops-deployment
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: final-devops-netpol
  namespace: final-devops-prod
spec:
  podSelector:
    matchLabels:
      app: final-devops-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
