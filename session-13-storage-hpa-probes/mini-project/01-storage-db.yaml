apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  labels:
    app: miniproject-db
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "RootSecurePassword456!"
  MYSQL_DATABASE: "webapp_db"
  MYSQL_USER: "appuser"
  MYSQL_PASSWORD: "AppUserPass789!"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data-pvc
  labels:
    app: miniproject-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-db
  labels:
    app: miniproject-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miniproject-db
  template:
    metadata:
      labels:
        app: miniproject-db
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        envFrom:
        - secretRef:
            name: db-secret
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/mysql
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootSecurePassword456!"]
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootSecurePassword456!"]
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: db-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  labels:
    app: miniproject-db
spec:
  type: ClusterIP
  selector:
    app: miniproject-db
  ports:
  - port: 3306
    targetPort: 3306
