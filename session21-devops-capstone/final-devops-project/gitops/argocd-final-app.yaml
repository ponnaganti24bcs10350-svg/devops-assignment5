apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: final-devops-enterprise
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ponnaganti24bcs10350-svg/devops-assignment5.git'
    targetRevision: main
    path: final-devops-project/kubernetes
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: final-devops-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
